services:
  app:
    build: .
    env_file:
      - .env
    expose:
      - "8000"
    environment:
      TZ: UTC
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
